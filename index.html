<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0d0a">
<title>Border Bowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="hud-score"><span id="hAway"></span><span id="hHome"></span></div>
  <div class="hud-mid"><span id="hClock"></span><button id="btnPause" aria-label="Pause"><i></i><i></i></button></div>
  <div id="hDown"></div>
</div>
<div id="ready" hidden>
  <div class="rb-label">GET READY!</div>
  <button class="rb-btn" type="button">Kick Off<svg viewBox="0 0 22 9" width="44" height="18" aria-hidden="true" shape-rendering="crispEdges"><g fill="#fff"><rect x="0" y="2" width="6" height="1"/><rect x="2" y="4" width="5" height="1"/><rect x="0" y="6" width="6" height="1"/></g><g fill="#f4f4f4"><rect x="10" y="2" width="8" height="5"/><rect x="11" y="1" width="6" height="7"/><rect x="12" y="0" width="4" height="9"/><rect x="18" y="3" width="1" height="3"/><rect x="9" y="3" width="1" height="3"/></g><g fill="#0b0b0b"><rect x="13" y="4" width="3" height="1"/><rect x="13" y="3" width="1" height="1"/><rect x="15" y="5" width="1" height="1"/></g></svg></button>
</div>
<div id="chip" hidden></div>
<div id="tapHint" class="box" hidden>TAP TO SNAP</div>
<button id="btnScramble" class="btn" hidden>RUN</button>

<div id="sheet" hidden></div>
<div id="banner" class="overlay" hidden><div class="box"><div id="bTitle"></div><div id="bSub"></div></div></div>
<div id="card" class="overlay" hidden></div>
<div id="meter" class="overlay" hidden></div>
<div id="screen" hidden></div>
<div id="rotate" hidden><div class="phone"></div><p>TURN YOUR PHONE SIDEWAYS</p></div>

<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/engine.js"></script>
<script src="js/league.js"></script>
<script src="js/d3teams.js"></script>
<script src="js/match.js"></script>
<script src="js/live.js"></script>
<script src="js/national.js"></script>
<script src="js/playbook.js"></script>
<script src="js/ui.js"></script>
<!--/BODY-->
</body>
</html>
